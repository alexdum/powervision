# ==============================================================================
# Sync GitHub → Hugging Face Spaces
# ==============================================================================
# Triggered on pushes to main. Syncs CODE ONLY to the HF Space repo.
# Parquet data (1.5 GB, in .gitignore) is pushed separately via
# scripts/push_to_hf.sh from the server where the data lives.
#
# Required GitHub secret:
#   HF_TOKEN — Hugging Face write token (generate at hf.co/settings/tokens)
# ==============================================================================

name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      # --- Check out the GitHub repo ---
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: github-repo

      # --- Clone the HF Space repo with retry (HF can return 429 during rebuilds) ---
      - name: Clone HF Space repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          for i in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 git clone \
              https://adumitrescu:${HF_TOKEN}@huggingface.co/spaces/adumitrescu/powervision \
              hf-repo && break
            echo "⚠️ Clone attempt $i failed (likely 429 rate limit). Retrying in $((i * 30))s..."
            sleep $((i * 30))
          done

      # --- Sync code from GitHub checkout into HF clone ---
      # This preserves the LFS-tracked Parquet data already in the HF repo
      # while updating all code, CSS, JS, GeoJSON, and config files.
      - name: Sync code files
        run: |
          # Sync root-level Dockerfile (HF-specific, port 7860)
          cp github-repo/Dockerfile hf-repo/Dockerfile

          # Sync app source code (excludes Parquet data which is in .gitignore)
          rsync -av --delete \
            --exclude='www/data/pecd/' \
            github-repo/app/ hf-repo/app/

          # Copy README_HF.md as README.md for HF frontmatter
          cp github-repo/README_HF.md hf-repo/README.md

      # --- Commit and push to HF ---
      - name: Push to HF Space
        working-directory: hf-repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Stage all changes
          git add -A

          # Only commit and push if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to push to HF Space."
          else
            git commit -m "sync: $(date -u +'%Y-%m-%d %H:%M UTC') from GitHub"
            git push
            echo "✅ Pushed code changes to HF Space."
          fi
